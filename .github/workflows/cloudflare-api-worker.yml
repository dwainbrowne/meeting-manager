name: Cloudflare API Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-api-worker.yml"
      - "backend/api-worker/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-api-worker.yml"
      - "backend/api-worker/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test API
        run: npm test

      - name: Dry-run staging deploy
        run: npm run dry-run:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: staging
    defaults:
      run:
        working-directory: backend/api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npm run d1:migrations:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-manual:
    name: Deploy Selected Environment
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend/api-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npm run d1:migrations:production
          else
            npm run d1:migrations:staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npm run deploy
          else
            npm run deploy:staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
